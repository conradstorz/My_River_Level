# River Monitor connects to the shared, always-on PostgreSQL server (see the
# separate `shared-postgres` project) over the external `shared-db` network.
# It does not run its own database.
#
# Prerequisite: start the shared server first, in the shared-postgres project:
#   docker compose up -d
services:
  app:
    build: .
    ports:
      - "5743:5743"
    environment:
      # Secrets come from .env (gitignored); :? fails loudly if unset.
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY in .env}
    volumes:
      # Named volume (not a host bind mount) so logs persist and the app runs
      # against a remote Docker daemon, which can't mount Windows host paths.
      - app_logs:/app/logs
    restart: unless-stopped
    networks:
      - shared-db

# Owned by the shared-postgres project; we join it as an external network.
networks:
  shared-db:
    external: true
    name: shared-db

volumes:
  app_logs:
