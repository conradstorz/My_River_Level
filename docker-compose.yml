# River Monitor connects to the shared, always-on PostgreSQL server (see the
# separate `shared-postgres` project) over the external `shared-db` network.
# It does not run its own database.
#
# Prerequisite: start the shared server first, in the shared-postgres project:
#   docker compose up -d
services:
  app:
    build: .
    ports:
      - "5743:5743"
    environment:
      # Secrets come from .env (gitignored); :? fails loudly if unset.
      # Safe to interpolate: none of these values contain a `$`.
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY in .env}
      # Portal login. Without a password hash the admin pages refuse every
      # request with 503 rather than falling open — they show and accept your
      # Telegram, Twilio, and Facebook credentials.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # NOTE: a werkzeug scrypt hash contains `$` separators, and compose
      # interpolates `$name` here. The value in .env MUST have every `$`
      # written as `$$` or the salt is silently eaten and no password can
      # ever match. See .env.example for a generator that escapes for you.
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
      # Number of reverse proxies whose X-Forwarded-For to trust (0 = none).
      # Rate limits key on the client address, so behind a proxy this must be
      # set or every visitor shares the proxy's bucket.
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-0}
    volumes:
      # Named volume (not a host bind mount) so logs persist and the app runs
      # against a remote Docker daemon, which can't mount Windows host paths.
      - app_logs:/app/logs
    restart: unless-stopped
    # /healthz returns 503 if any worker thread has died, so a container that
    # still serves pages but has stopped monitoring is reported unhealthy.
    # python:3.11-slim ships no curl, hence urllib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5743/healthz', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - shared-db

# Owned by the shared-postgres project; we join it as an external network.
networks:
  shared-db:
    external: true
    name: shared-db

volumes:
  app_logs:
