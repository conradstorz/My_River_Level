# Test overlay — runs the suite inside the Docker network against the shared
# PostgreSQL server (service hostname `postgres` on the external shared-db
# network). No ports relied upon and no host paths bind-mounted, so it works
# when the Docker daemon is remote from the CLI machine.
#
# Prerequisite: the shared-postgres server is running (docker compose up -d in
# that project). The river_test database is created by its init script, and
# tests/conftest.py also creates it on demand if it's ever missing.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm test
services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - TEST_DATABASE_URL=postgresql://river:river@postgres:5432/river_test
    networks:
      - shared-db
